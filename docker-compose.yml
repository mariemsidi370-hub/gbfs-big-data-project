services:
  postgres:
    image: postgres:13
    container_name: gbfs_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: gbfs_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  trino:
    image: trinodb/trino:latest
    container_name: gbfs_trino
    user: root
    ports:
      - "8081:8080"
    volumes:
      - ./trino/etc:/etc/trino
    depends_on:
      - mongodb
    restart: unless-stopped

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset.final
    container_name: gbfs_superset
    ports:
      - "8089:8088"
    environment:
      SUPERSET_SECRET_KEY: your_secret_key_here
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: gbfs_airflow
    ports:
      - "8082:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      PYTHONPATH: /opt/airflow
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: gbfs
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/data:/opt/airflow/data
      - ./pipelines:/opt/airflow/pipelines
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null || true &&
        airflow standalone
      "
    restart: unless-stopped

volumes:
  mongodb_data:
  postgres_data: